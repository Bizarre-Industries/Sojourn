# Sojourn — CodeQL configuration.
#
# Multi-language scans require this config-file approach (per
# https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning).
#
# Coverage:
#   - swift     — main app code under Sojourn/
#   - python    — .github/scripts/ + scripts/
#   - actions   — workflow files themselves (CodeQL Actions language)
#
# JavaScript was removed from the matrix: Sojourn has no .js/.ts source
# files. Inline `actions/github-script` blocks are analysed by the
# `actions` language pack, not `javascript-typescript`.
#
# Pack stack per language:
#   - codeql/<lang>-queries:codeql-suites/<lang>-security-and-quality.qls
#       — official extended pack, ships with the CodeQL bundle.
#   - githubsecuritylab/codeql-<lang>-queries
#       — community pack from GitHub Security Lab. ONLY EXISTS for the
#         languages with directories at
#         https://github.com/GitHubSecurityLab/CodeQL-Community-Packs:
#         cpp, csharp, go, java, javascript, python, ruby.
#       — there is NO community pack for swift or actions. Don't add
#         `githubsecuritylab/codeql-swift-queries` or
#         `githubsecuritylab/codeql-actions-queries` — they don't exist
#         and CodeQL will fail with "not found in the registry".

name: "Sojourn CodeQL config"

disable-default-queries: false

# Per-language pack stack.
packs:
  swift:
    - codeql/swift-queries:codeql-suites/swift-security-and-quality.qls
  python:
    - codeql/python-queries:codeql-suites/python-security-and-quality.qls
    - githubsecuritylab/codeql-python-queries
  actions:
    - codeql/actions-queries:codeql-suites/actions-security-and-quality.qls

# Path filters — exclude bundled binaries, build outputs, generated files.
paths-ignore:
  - "Sojourn/Resources/bin/**" # bundled gitleaks/age/cosign binaries
  - ".build/**" # SPM artefacts
  - "build/**" # xcodebuild artefacts
  - "DerivedData/**" # Xcode artefacts
  - "**/*.xcodeproj/**" # generated Xcode project (xcodegen)
  - "vendor/**"
  - "third_party/**"
  - "node_modules/**"
