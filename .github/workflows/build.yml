name: Build

# Heavy Swift/Xcode build + test pipeline. Only runs on release tag push
# and manual dispatch — `ci.yml` covers lint/format/secret-scan on every
# normal commit. Notarize/sign/publish lives in `notarize.yml`.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:


permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-test:
    name: swift test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.x'

      # Cache resolved SPM packages + build outputs. Keyed on
      # Package.resolved so the cache invalidates when deps change but
      # is shared across runs that have the same dep graph. Shared with
      # codeql.yml swift job (same key prefix → both populate/restore).
      #
      # Requires Package.resolved committed (see
      # docs/process/security-tooling.md Bootstrap step 1).
      - name: Cache SPM
        # zizmor: ignore[cache-poisoning]
        # Tag/dispatch only — no PR write path that could poison this
        # cache. Lateral movement between tag runs is bounded by the
        # Package.resolved hash key.
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Swift version
        run: swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build
        run: swift build -c debug

      - name: Test
        run: swift test --parallel

  xcodebuild:
    name: xcodebuild test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.x'

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project Sojourn.xcodeproj -scheme Sojourn

      - name: Test
        id: xcodebuild-test
        run: |
          # SojournUITests skipped on CI — XCUITest test-runner refuses
          # to load an ad-hoc-signed test bundle (Team ID mismatch). UI
          # coverage runs under the notarize.yml job which holds a real
          # Developer ID identity.
          xcodebuild test \
            -project Sojourn.xcodeproj \
            -scheme Sojourn \
            -destination 'platform=macOS' \
            -enableCodeCoverage YES \
            -resultBundlePath build/Test.xcresult \
            -skip-testing:SojournUITests \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # Upload xcresult on failure for debugging without re-running.
      # 14-day retention — long enough to investigate, short enough not
      # to bloat storage. xcresult bundles contain test logs, attached
      # screenshots, and build settings — invaluable for "why did this
      # fail in CI but pass locally" debugging.
      - name: Upload xcresult on failure
        if: failure() && steps.xcodebuild-test.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcresult-${{ github.run_id }}
          path: build/Test.xcresult
          retention-days: 14
          if-no-files-found: warn

      # Coverage report — uploaded on success. Useful for tracking
      # coverage over time via external tools (codecov, coveralls) when
      # those land. 30-day retention.
      - name: Extract coverage
        if: success()
        run: |
          xcrun xccov view --report --json build/Test.xcresult > coverage.json
          xcrun xccov view --report build/Test.xcresult > coverage.txt

      - name: Upload coverage
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.run_id }}
          path: |
            coverage.json
            coverage.txt
          retention-days: 30
          if-no-files-found: warn
