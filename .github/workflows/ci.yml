name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-test:
    name: swift test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '^16.0'

      - name: Swift version
        run: swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build
        run: swift build -c debug

      - name: Test
        run: swift test --parallel

  xcodebuild:
    name: xcodebuild test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '^16.0'

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project Sojourn.xcodeproj -scheme Sojourn

      - name: Test
        run: |
          # SojournUITests skipped on CI — XCUITest test-runner refuses
          # to load an ad-hoc-signed test bundle (Team ID mismatch). UI
          # coverage runs under the notarize.yml job which holds a real
          # Developer ID identity.
          xcodebuild test \
            -project Sojourn.xcodeproj \
            -scheme Sojourn \
            -destination 'platform=macOS' \
            -enableCodeCoverage YES \
            -skip-testing:SojournUITests \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

  gitleaks:
    name: gitleaks scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Use the gitleaks binary directly. The marketplace action requires
      # a paid license for organization repos as of 2024-08; the binary
      # is unaffected (MIT licensed) and exits non-zero on findings.
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks dir --config=.gitleaks.toml --verbose

        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: SwiftLint (advisory)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install swiftlint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging || true

  format-check:
    name: swift-format (advisory)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install swift-format
        run: brew install swift-format
      - name: Check
        run: |
          swift-format lint --recursive Sojourn SojournTests SojournUITests \
            --parallel --configuration .swift-format || true
