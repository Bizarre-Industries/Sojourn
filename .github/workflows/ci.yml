name: CI

# Quality + security checks on every commit. Heavy Swift/Xcode build +
# test runs out of `build.yml` on tag push only. Notarize/sign/publish
# lives in `notarize.yml`.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# All jobs are read-only quality/security gates. No writes anywhere.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # Use the gitleaks binary directly. The marketplace action requires
      # a paid license for organization repos as of 2024-08; the binary
      # is unaffected (MIT licensed) and exits non-zero on findings.
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          archive="${RUNNER_TEMP}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o "${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks dir --config=.gitleaks.toml --redact --verbose
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: SwiftLint (advisory)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install swiftlint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging || true

  format-check:
    name: swift-format (advisory)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install swift-format
        run: brew install swift-format
      - name: Check
        run: |
          swift-format lint --recursive Sojourn SojournTests SojournUITests \
            --parallel --configuration .swift-format || true
