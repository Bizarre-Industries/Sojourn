name: CodeQL

# CodeQL split into two jobs by cost:
#
#   analyze-light  (python, actions)
#     ubuntu, build-mode=none, ~2 min each. Cheap enough to run on
#     every commit and PR — gives fast feedback on workflow file
#     changes and Python helper script changes.
#
#   analyze-swift  (swift)
#     macos-15, build-mode=manual (`swift build`), ~10 min.
#     Heavy. Runs only on:
#       - tag push v*           (correlate to a shipped version)
#       - weekly cron Mon 06:00 (catch new advisories)
#       - workflow_dispatch     (maintainer audit on demand)
#     This matches the original triggering before the multi-language
#     expansion. Sojourn doesn't have so much Swift churn that a daily
#     full-app scan is necessary; weekly + per-release is the right
#     cadence.
#
# JavaScript was removed entirely — Sojourn has no .js/.ts source files.
# Inline JS in actions/github-script blocks is analysed by the `actions`
# language pack.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:


permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  # ----------------------------------------------------------------------- #
  # Light path — runs on every push + PR + cron + dispatch
  # ----------------------------------------------------------------------- #
  analyze-light:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        language: [ python, actions ]

    steps:
      - name: Checkout
        uses: actions/checkout@v5 # PIN-SHA-AFTER
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4 # PIN-SHA-AFTER
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4 # PIN-SHA-AFTER
        with:
          category: /language:${{ matrix.language }}
          upload: always

  # ----------------------------------------------------------------------- #
  # Heavy path — Swift only, gated to tag/cron/dispatch
  # ----------------------------------------------------------------------- #
  analyze-swift:
    name: Analyze swift
    runs-on: macos-15
    timeout-minutes: 60

    # Skip on push-to-branch and pull_request. Run only when:
    #   - a tag matching v* is pushed
    #   - the weekly cron fires
    #   - a maintainer manually triggers
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v5 # PIN-SHA-AFTER
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1 # PIN-SHA-AFTER
        with:
          xcode-version: '^16.0'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4 # PIN-SHA-AFTER
        with:
          languages: swift
          build-mode: manual
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-extended

      - name: Build Swift target
        run: swift build -c debug

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4 # PIN-SHA-AFTER
        with:
          category: /language:swift
          upload: always
