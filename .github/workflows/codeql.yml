name: CodeQL

# CodeQL split into two jobs by cost:
#
#   analyze-light  (python, actions)
#     ubuntu, build-mode=none, ~2 min each. Runs on every commit/PR.
#
#   analyze-swift  (swift)
#     macos-15, build-mode=manual (`swift build`), ~10 min.
#     Runs only on tag push v*, weekly cron, manual dispatch.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:


permissions:
  actions: read
  contents: read
  security-events: write

# Cancel in-progress runs ONLY for PR context. Pushes to main, tag
# pushes, and scheduled runs all complete fully — they're either
# release-correlated or low-frequency, and shouldn't be killed by
# stacked triggers.
concurrency:
  group: codeql-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze-light:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        language: [ python, actions ]

    steps:
      - name: Checkout
        uses: actions/checkout@v5 # PIN-SHA-AFTER
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4 # PIN-SHA-AFTER
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4 # PIN-SHA-AFTER
        with:
          category: /language:${{ matrix.language }}
          upload: always

  analyze-swift:
    name: Analyze swift
    runs-on: macos-15
    timeout-minutes: 60

    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v5 # PIN-SHA-AFTER
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1 # PIN-SHA-AFTER
        with:
          xcode-version: '^16.0'

      # Same SPM cache key as build.yml + notarize.yml. All three jobs
      # share the cache: build.yml swift-test populates it on tag push,
      # this analyze-swift job restores from it on the same tag push,
      # cron runs use whatever's freshest.
      - name: Cache SPM
        uses: actions/cache@v4 # PIN-SHA-AFTER
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4 # PIN-SHA-AFTER
        with:
          languages: swift
          build-mode: manual
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-extended

      - name: Build Swift target
        run: swift build -c debug

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4 # PIN-SHA-AFTER
        with:
          category: /language:swift
          upload: always
