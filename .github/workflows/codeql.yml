name: CodeQL

# CodeQL Swift analysis requires `swift build`, which is the heavy path
# we deliberately keep out of per-commit CI. Trigger only on:
#   - release tag push (correlates findings to a shipped version)
#   - weekly cron (catches new advisories independently of releases)
#   - manual dispatch (maintainer audit on demand)
on:
  push:
    tags:
      - 'v*'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: macos-15
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [swift]

    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '^16.0'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Build (manual, SPM)
        run: swift build -c debug

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
