name: CodeQL

# CodeQL across Sojourn's source: Swift app code, Python helper
# scripts, the GitHub Actions workflow files themselves.
#
# JavaScript was removed from the matrix — Sojourn has no .js/.ts
# source files. Inline JS in actions/github-script blocks is analysed
# by the `actions` language pack, not `javascript-typescript`.
#
# Triggers:
#   - push to main           — fast feedback on every merge
#   - pull_request to main   — gate merges on no new high-severity findings
#   - tag push v*            — correlate findings to a shipped version
#   - weekly cron Mon 06:00  — catch new advisories independently of code
#   - workflow_dispatch      — maintainer audit on demand

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:


permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            runner: macos-15
            build-mode: manual
            timeout: 60
          - language: python
            runner: ubuntu-latest
            build-mode: none
            timeout: 30
          - language: actions
            runner: ubuntu-latest
            build-mode: none
            timeout: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5 # PIN-SHA-AFTER
        with:
          persist-credentials: false

      - name: Select Xcode (Swift only)
        if: matrix.language == 'swift'
        uses: maxim-lobanov/setup-xcode@v1 # PIN-SHA-AFTER
        with:
          xcode-version: '^16.0'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4 # PIN-SHA-AFTER
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-extended

      - name: Build Swift target (manual)
        if: matrix.language == 'swift'
        run: swift build -c debug

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4 # PIN-SHA-AFTER
        with:
          category: /language:${{ matrix.language }}
          upload: always
