name: CodeQL

# CodeQL split into two jobs by cost:
#
#   analyze-light  (python, actions)
#     ubuntu, build-mode=none, ~2 min each. Runs on every commit/PR.
#
#   analyze-swift  (swift)
#     macos-26, build-mode=manual (`swift build`), ~10 min.
#     Runs only on tag push v*, weekly cron, manual dispatch.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:


# Workflow defaults: read-only. `security-events: write` is scoped to
# the analyze jobs that need to upload SARIF results, not the whole
# workflow (zizmor `excessive-permissions` finding).
permissions:
  contents: read

# Cancel in-progress runs ONLY for PR context. Pushes to main, tag
# pushes, and scheduled runs all complete fully — they're either
# release-correlated or low-frequency, and shouldn't be killed by
# stacked triggers.
concurrency:
  group: codeql-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze-light:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ python, actions ]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          category: /language:${{ matrix.language }}
          upload: always

  analyze-swift:
    name: Analyze swift
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write

    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.x'

      # Same SPM cache key as build.yml + notarize.yml. All three jobs
      # share the cache: build.yml swift-test populates it on tag push,
      # this analyze-swift job restores from it on the same tag push,
      # cron runs use whatever's freshest.
      - name: Cache SPM
        # zizmor: ignore[cache-poisoning]
        # analyze-swift runs only on tag push, weekly cron, and manual
        # dispatch — no PR vector. Cache key is bound to
        # Package.resolved.
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          languages: swift
          build-mode: manual
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-extended

      - name: Build Swift target
        run: swift build -c debug

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          category: /language:swift
          upload: always
