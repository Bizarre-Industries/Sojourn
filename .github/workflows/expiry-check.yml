name: Expiry check

on:
  schedule:
    # Weekly on Mondays at 09:00 UTC. Misses are OK — scheduled events
    # can be delayed under load. Workflow is idempotent.
    - cron: '0 9 * * 1'
  workflow_dispatch:


permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5 # PIN-SHA-AFTER
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5 # PIN-SHA-AFTER
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '.github/scripts/requirements.txt'

      - name: Install deps
        run: |
          python -m pip install --quiet --require-hashes \
            -r .github/scripts/requirements.txt 2>/dev/null || \
            python -m pip install --quiet -r .github/scripts/requirements.txt

      - name: Validate config schema
        run: python .github/scripts/check-expiry.py --validate

      - name: Run expiry check
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/check-expiry.py

      - name: Watchdog — open issue if anything above failed
        if: failure()
        uses: actions/github-script@v7 # PIN-SHA-AFTER
        with:
          script: |
            const title = '[expiry-check] workflow failed';
            const body = [
              'The weekly expiry-check workflow failed. Without this, secret',
              'expiry tracking is silently broken — investigate before next',
              'Monday or you risk a missed rotation.',
              '',
              `Run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'rotation-system-failure',
              state: 'open'
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title, body,
                labels: ['rotation-system-failure']
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Another failed run: ${context.runId}`
              });
            }
