name: Expiry check

on:
  schedule:
    # Weekly on Mondays at 09:00 UTC. Misses are OK — scheduled events
    # can be delayed under load. Workflow is idempotent.
    - cron: '0 9 * * 1'
  workflow_dispatch:


permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load 1Password secrets
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APPSTORE_API_KEY_ID: op://Bizarre-Industries/sojourn-appstore-connect-api/key-id
          APPSTORE_API_ISSUER_ID: op://Bizarre-Industries/sojourn-appstore-connect-api/issuer-id
          APPSTORE_API_KEY_P8: op://Bizarre-Industries/sojourn-appstore-connect-api/key
          HOMEBREW_TAP_TOKEN: op://Bizarre-Industries/sojourn-homebrew-tap-token/credential

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '.github/scripts/requirements.txt'

      - name: Install deps
        run: |
          python -m pip install --quiet --require-hashes \
            -r .github/scripts/requirements.txt 2>/dev/null || \
            python -m pip install --quiet -r .github/scripts/requirements.txt

      - name: Validate config schema
        run: python .github/scripts/check-expiry.py --validate

      - name: Run expiry check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/check-expiry.py

      - name: Watchdog — open issue if anything above failed
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = '[expiry-check] workflow failed';
            const body = [
              'The weekly expiry-check workflow failed. Without this, secret',
              'expiry tracking is silently broken — investigate before next',
              'Monday or you risk a missed rotation.',
              '',
              `Run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'rotation-system-failure',
              state: 'open'
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title, body,
                labels: ['rotation-system-failure']
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Another failed run: ${context.runId}`
              });
            }
