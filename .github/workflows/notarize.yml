name: Notarize & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-sign-notarize:
    name: Build, sign, notarize
    runs-on: macos-26
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # ADD this step after the checkout (~line 20):
      - name: Load 1Password secrets
        uses: 1password/load-secrets-action@92467eb28f72e8255933372f1e0707c567ce2259 # v4.0.0
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          DEVELOPER_ID_P12_BASE64: op://Bizarre-Industries/sojourn-developer-id-p12/credential
          DEVELOPER_ID_P12_PASSWORD: op://Bizarre-Industries/sojourn-developer-id-p12/p12-password
          DEVELOPER_ID_IDENTITY: op://Bizarre-Industries/sojourn-developer-id-p12/identity
          DEVELOPMENT_TEAM: op://Bizarre-Industries/sojourn-developer-id-p12/team-id
          KEYCHAIN_PASSWORD: op://Bizarre-Industries/sojourn-keychain-password/password
          OAUTH_CLIENT_ID: op://Bizarre-Industries/sojourn-github-oauth/client-id
          APPSTORE_API_KEY_ID: op://Bizarre-Industries/sojourn-appstore-connect-api/key-id
          APPSTORE_API_ISSUER_ID: op://Bizarre-Industries/sojourn-appstore-connect-api/issuer-id
          APPSTORE_API_KEY_P8: op://Bizarre-Industries/sojourn-appstore-connect-api/key
          HOMEBREW_TAP_TOKEN: op://Bizarre-Industries/sojourn-homebrew-tap-token/credential
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.x'

      # Cache resolved SPM packages. Same key as build.yml + codeql.yml
      # so all three jobs share the cache. xcodebuild's package
      # resolution still runs (it uses DerivedData/SourcePackages which
      # we don't cache), but `swift package resolve` is fast on cache
      # hit and primes the workspace.
      - name: Cache SPM
        # zizmor: ignore[cache-poisoning]
        # notarize.yml runs only on tag push — no PR vector. Cache key
        # is bound to Package.resolved.
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Import Developer ID certificate
        run: |
          echo "$DEVELOPER_ID_P12_BASE64" | base64 --decode -o /tmp/dev-id.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 43200 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/dev-id.p12 -P "$DEVELOPER_ID_P12_PASSWORD" -A -t cert -f pkcs12 -k build.keychain
          # shellcheck disable=SC2046  # intentional word split
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | sed 's/\"//g')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm /tmp/dev-id.p12

      - name: Inject Local.xcconfig
        run: |
          cat > Sojourn/Config/Local.xcconfig <<EOF
          DEVELOPMENT_TEAM = $DEVELOPMENT_TEAM
          SOJOURN_OAUTH_CLIENT_ID = $OAUTH_CLIENT_ID
          EOF

      - name: Download bundled binaries (gitleaks, age)
        env:
          STRICT_CHECKSUMS: "1"
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/download-bundled-bins.sh

      - name: Re-sign bundled binaries
        run: bash scripts/sign.sh

      - name: Build Sojourn.app
        run: |
          xcodebuild -project Sojourn.xcodeproj \
            -scheme Sojourn \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="$DEVELOPER_ID_IDENTITY" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime" \
            clean build

      - name: Create DMG
        run: bash scripts/make-dmg.sh build/Build/Products/Release/Sojourn.app

      # Upload the signed-but-not-yet-notarized DMG. If notarization
      # fails or the queue is slow, you can download this and re-run
      # `xcrun notarytool submit` locally without rebuilding (~15 min
      # saved). 30-day retention covers any reasonable retry window.
      #
      # Order matters: this step is BEFORE notarization, so even if
      # notarization fails the DMG is preserved.
      - name: Upload pre-notarize DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sojourn-dmg-pre-notarize-${{ github.ref_name }}
          path: Sojourn.dmg
          retention-days: 30
          if-no-files-found: error

      - name: Notarize DMG
        run: bash scripts/notarize.sh Sojourn.dmg

      - name: Verify Gatekeeper acceptance
        run: |
          spctl --assess --type execute --verbose=4 build/Build/Products/Release/Sojourn.app
          spctl --assess --type install --verbose=4 Sojourn.dmg

      - name: Upload release artifact
        # zizmor: ignore[superfluous-actions]
        # action handles checksum + asset upload + release-note glue
        # in one step; replacing with `gh release` script costs more
        # than the action saves. Informational finding only.
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: Sojourn.dmg
          generate_release_notes: true

      - name: Setup Homebrew
        if: "!contains(github.ref, '-')"
        uses: Homebrew/actions/setup-homebrew@main

      - name: Style-check cask
        # `brew audit [path ...]` was disabled in Homebrew 5.x — only
        # name-based audit is supported, which requires the cask already
        # be tapped at the upstream version. `brew style` covers the
        # local-file linting layer; `brew bump-cask-pr` runs full audit
        # against the bumped tap-side cask before opening the PR.
        if: "!contains(github.ref, '-')"
        run: brew style ./Casks/sojourn.rb

      - name: Publish Homebrew cask update
        # Direct-push to tap main (council 2026-05-01-notarize-publish-direct-push,
        # re-voted after fine-grained PAT scope blocked the bump-cask-pr hybrid).
        # The HOMEBREW_TAP_TOKEN PAT has Contents: write but not Pull requests:
        # write — bump-cask-pr's PR step + `gh pr create` both 403 with
        # "Resource not accessible by personal access token". Direct-push
        # only needs Contents: write, which the PAT has.
        #
        # All five council members re-voted APPROVE-WITH-CONDITIONS. Conditions
        # implemented inline below; see deliberation log for the mapping.
        #
        # TODO(self-hosted runner migration): the push embeds the token in
        # `git -c http.extraheader='AUTHORIZATION: bearer …' push` argv. On
        # ephemeral hosted runners the blast radius is one VM. If we ever move
        # to self-hosted runners, switch to a credential helper or GitHub App
        # token exchange so the token never appears in /proc/<pid>/cmdline.
        if: "!contains(github.ref, '-')"
        env:
          TAP_TOKEN: ${{ env.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          # Mask the token so it can't leak via accidental `set -x` or echoes
          # inside this step.
          echo "::add-mask::${TAP_TOKEN}"

          version="${GITHUB_REF_NAME#v}"

          # Tag-format guard (security council, condition #1). Hard-fail
          # before any string interpolation; refuse anything that isn't
          # strict semver. Catches typos and closes shell-injection vectors.
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is not in vN.N.N form; refusing to publish"
            exit 1
          fi

          # Compute sha256 from the locally notarized + stapled DMG. This is
          # the same DMG Gatekeeper just verified two steps up. We do NOT
          # re-download from the GitHub release asset (devil-advocate raised
          # the upload-corruption case; we mitigate by running brew audit
          # below, which DOES re-download and compares).
          sha=$(shasum -a 256 Sojourn.dmg | cut -d' ' -f1)

          # Clone the tap with the token in the URL — it lives there only
          # until the next command, which scrubs it.
          tap_dir="$(mktemp -d)/homebrew-sojourn"
          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/Bizarre-Industries/homebrew-sojourn.git" \
            "${tap_dir}"

          # Token scrub (security council, condition #2). After this point
          # `.git/config` has no credentials. The push at the end of this
          # step re-injects the token via `-c http.extraheader=…` for one
          # invocation — token in argv of one process, never on disk.
          git -C "${tap_dir}" remote set-url origin \
            "https://github.com/Bizarre-Industries/homebrew-sojourn.git"

          # Capture the pre-edit version + sha to drive a negative grep
          # afterwards (perf-skeptic, condition #6).
          old_version=$(grep -oE '^  version "[^"]+"' "${tap_dir}/Casks/sojourn.rb" | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          old_sha=$(grep -oE '^  sha256 "[a-f0-9]{64}"' "${tap_dir}/Casks/sojourn.rb" | head -1 | sed -E 's/.*"([a-f0-9]+)".*/\1/')

          # Anchored sed: only the `version "…"` and `sha256 "…"` lines at
          # column 3 are touched. Won't match URL strings or comments.
          sed -i.bak -E \
            -e "s|^([[:space:]]*version )\".*\"|\1\"${version}\"|" \
            -e "s|^([[:space:]]*sha256 )\".*\"|\1\"${sha}\"|" \
            "${tap_dir}/Casks/sojourn.rb"
          rm "${tap_dir}/Casks/sojourn.rb.bak"

          # Post-edit verification — positive (architect + ux-critic).
          if ! grep -q "^  version \"${version}\"$" "${tap_dir}/Casks/sojourn.rb"; then
            echo "::error::version substitution did not produce expected line"
            cat "${tap_dir}/Casks/sojourn.rb"
            exit 1
          fi
          if ! grep -qE "^  sha256 \"${sha}\"$" "${tap_dir}/Casks/sojourn.rb"; then
            echo "::error::sha256 substitution did not produce expected line"
            cat "${tap_dir}/Casks/sojourn.rb"
            exit 1
          fi

          # Post-edit verification — negative (perf-skeptic, condition #6).
          # Catches the case where sed produced both old + new strings.
          if [ -n "${old_version}" ] && [ "${old_version}" != "${version}" ] && \
             grep -q "^  version \"${old_version}\"$" "${tap_dir}/Casks/sojourn.rb"; then
            echo "::error::old version ${old_version} still present after sed"
            exit 1
          fi
          if [ -n "${old_sha}" ] && [ "${old_sha}" != "${sha}" ] && \
             grep -q "^  sha256 \"${old_sha}\"$" "${tap_dir}/Casks/sojourn.rb"; then
            echo "::error::old sha ${old_sha} still present after sed"
            exit 1
          fi

          # Style + online audit on the bumped cask via the tap's own brew
          # tree (devil-advocate condition: replace bump-cask-pr's online
          # audit). Wrapped in `timeout 180` to fail fast if the GitHub
          # release CDN is cold (perf-skeptic, condition #1).
          brew tap Bizarre-Industries/sojourn
          tap_repo="$(brew --repo Bizarre-Industries/sojourn)"
          mkdir -p "${tap_repo}/Casks"
          cp "${tap_dir}/Casks/sojourn.rb" "${tap_repo}/Casks/sojourn.rb"
          brew style "${tap_repo}/Casks/sojourn.rb"
          timeout 180 brew audit --cask --online sojourn

          # Build the commit message in a variable to avoid embedding literal
          # newlines in the YAML run-block (would break the `|` scalar).
          msg=$(printf 'release: bump sojourn to v%s\n\nsha256 %s\nsource: %s/%s/releases/tag/%s\nworkflow-run: %s/%s/actions/runs/%s' \
            "${version}" "${sha}" \
            "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" \
            "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}")

          # Commit + push as the actions bot. DCO sign-off required by
          # org policy (web_commit_signoff_required = true).
          git -C "${tap_dir}" config user.name  "github-actions[bot]"
          git -C "${tap_dir}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "${tap_dir}" add Casks/sojourn.rb
          git -C "${tap_dir}" commit -s -m "${msg}"

          # Ephemeral-token push: token never lands in `.git/config`.
          # Wrap in `timeout 30` to fail fast on auth hangs (perf-skeptic).
          local_sha=$(git -C "${tap_dir}" rev-parse HEAD)
          timeout 30 git -C "${tap_dir}" \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: bearer ${TAP_TOKEN}" \
            push origin main

          # Verify the push actually landed (architect dissent #3). Bare
          # push exit code is not proof of remote state under network flakes.
          remote_sha=$(git -C "${tap_dir}" \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: bearer ${TAP_TOKEN}" \
            ls-remote origin refs/heads/main | cut -f1)
          if [ "${local_sha}" != "${remote_sha}" ]; then
            echo "::error::push exit 0 but remote main is ${remote_sha}, expected ${local_sha}"
            exit 1
          fi
          echo "Tap main is now at ${local_sha}"
