name: Notarize & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-sign-notarize:
    name: Build, sign, notarize
    runs-on: macos-15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # ADD this step after the checkout (~line 20):
      - name: Load 1Password secrets
        uses: 1password/load-secrets-action@92467eb28f72e8255933372f1e0707c567ce2259 # v4.0.0
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          DEVELOPER_ID_P12_BASE64: op://Bizarre-Industries/sojourn-developer-id-p12/credential
          DEVELOPER_ID_P12_PASSWORD: op://Bizarre-Industries/sojourn-developer-id-p12/p12-password
          DEVELOPER_ID_IDENTITY: op://Bizarre-Industries/sojourn-developer-id-p12/identity
          DEVELOPMENT_TEAM: op://Bizarre-Industries/sojourn-developer-id-p12/team-id
          KEYCHAIN_PASSWORD: op://Bizarre-Industries/sojourn-keychain-password/password
          OAUTH_CLIENT_ID: op://Bizarre-Industries/sojourn-github-oauth/client-id
          APPSTORE_API_KEY_ID: op://Bizarre-Industries/sojourn-appstore-connect-api/key-id
          APPSTORE_API_ISSUER_ID: op://Bizarre-Industries/sojourn-appstore-connect-api/issuer-id
          APPSTORE_API_KEY_P8: op://Bizarre-Industries/sojourn-appstore-connect-api/key
          HOMEBREW_TAP_TOKEN: op://Bizarre-Industries/sojourn-homebrew-tap-token/credential
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '^16.0'

      # Cache resolved SPM packages. Same key as build.yml + codeql.yml
      # so all three jobs share the cache. xcodebuild's package
      # resolution still runs (it uses DerivedData/SourcePackages which
      # we don't cache), but `swift package resolve` is fast on cache
      # hit and primes the workspace.
      - name: Cache SPM
        # zizmor: ignore[cache-poisoning]
        # notarize.yml runs only on tag push — no PR vector. Cache key
        # is bound to Package.resolved.
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Import Developer ID certificate
        run: |
          echo "$DEVELOPER_ID_P12_BASE64" | base64 --decode -o /tmp/dev-id.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 43200 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/dev-id.p12 -P "$DEVELOPER_ID_P12_PASSWORD" -A -t cert -f pkcs12 -k build.keychain
          # shellcheck disable=SC2046  # intentional word split
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | sed 's/\"//g')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm /tmp/dev-id.p12

      - name: Inject Local.xcconfig
        run: |
          cat > Sojourn/Config/Local.xcconfig <<EOF
          DEVELOPMENT_TEAM = $DEVELOPMENT_TEAM
          SOJOURN_OAUTH_CLIENT_ID = $OAUTH_CLIENT_ID
          EOF

      - name: Download bundled binaries (gitleaks, age)
        env:
          STRICT_CHECKSUMS: "1"
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/download-bundled-bins.sh

      - name: Re-sign bundled binaries
        run: bash scripts/sign.sh

      - name: Build Sojourn.app
        run: |
          xcodebuild -project Sojourn.xcodeproj \
            -scheme Sojourn \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="$DEVELOPER_ID_IDENTITY" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime" \
            clean build

      - name: Create DMG
        run: bash scripts/make-dmg.sh build/Build/Products/Release/Sojourn.app

      # Upload the signed-but-not-yet-notarized DMG. If notarization
      # fails or the queue is slow, you can download this and re-run
      # `xcrun notarytool submit` locally without rebuilding (~15 min
      # saved). 30-day retention covers any reasonable retry window.
      #
      # Order matters: this step is BEFORE notarization, so even if
      # notarization fails the DMG is preserved.
      - name: Upload pre-notarize DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sojourn-dmg-pre-notarize-${{ github.ref_name }}
          path: Sojourn.dmg
          retention-days: 30
          if-no-files-found: error

      - name: Notarize DMG
        run: bash scripts/notarize.sh Sojourn.dmg

      - name: Verify Gatekeeper acceptance
        run: |
          spctl --assess --type execute --verbose=4 build/Build/Products/Release/Sojourn.app
          spctl --assess --type install --verbose=4 Sojourn.dmg

      - name: Upload release artifact
        # zizmor: ignore[superfluous-actions]
        # action handles checksum + asset upload + release-note glue
        # in one step; replacing with `gh release` script costs more
        # than the action saves. Informational finding only.
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: Sojourn.dmg
          generate_release_notes: true

      - name: Setup Homebrew
        if: "!contains(github.ref, '-')"
        uses: Homebrew/actions/setup-homebrew@master

      - name: Audit cask
        if: "!contains(github.ref, '-')"
        run: brew audit --cask --new --online ./Casks/sojourn.rb

      - name: Publish Homebrew cask update
        if: "!contains(github.ref, '-')"
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ env.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sha=$(shasum -a 256 Sojourn.dmg | cut -d' ' -f1)
          brew tap Bizarre-Industries/sojourn
          brew bump-cask-pr \
            --version="${version}" \
            --sha256="${sha}" \
            --no-browse \
            --no-fork \
            Bizarre-Industries/sojourn/sojourn
