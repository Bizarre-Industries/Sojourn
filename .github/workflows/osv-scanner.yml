name: OSV-Scanner

# Supply-chain vulnerability scanning via Google's OSV-Scanner. Reads
# Package.resolved, requirements.txt, and any other lockfiles in the
# repo; cross-references against OSV.dev (which aggregates GHSA, RustSec,
# PyPA, npm advisories, etc.).
#
# Synergistic with cooldown-policy.md: we cite OSV.dev as the source of
# truth for advisory-aware cooldown bypass, and dogfood it here for our
# own dependency hygiene.

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: '0 7 * * 2'
  workflow_dispatch:


permissions:
  contents: read
  security-events: write
  actions: read

# Cancel stacked PR runs. Push/cron/dispatch always complete.
concurrency:
  group: osv-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan-scheduled:
    name: Scheduled scan
    if: github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.5 # PIN-SHA-AFTER
    permissions:
      contents: read
      security-events: write
      actions: read

  scan-pr:
    name: PR scan
    if: github.event_name == 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.3.5 # PIN-SHA-AFTER
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write
