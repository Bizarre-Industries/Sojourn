name: Pin Actions

# Resolves all GitHub Actions references in .github/workflows/* to
# immutable commit SHAs via pinact. Opens a PR with the changes.
#
# Why a dedicated PAT (WORKFLOWS_PAT):
#   GITHUB_TOKEN cannot modify files under .github/workflows/ even
#   with `contents: write` — GitHub rejects the push server-side as
#   privilege-escalation prevention. A fine-grained PAT with
#   `Workflows: Read and write` is required for both the checkout
#   (so the post-job push uses the right credential) and for
#   peter-evans/create-pull-request (so the PR-creating push has
#   workflow scope).
#
# This workflow is belt-and-braces. The primary defenses are:
#   1. Local pre-commit (`make pin-actions` runs `pinact run --update`)
#   2. zizmor.yml PR gate (fails if unpinned actions land)
#   3. Dependabot weekly bumps SHAs and refreshes # comments
#
# This cron sweep catches drift if a commit lands without local
# pinning. If WORKFLOWS_PAT becomes a maintenance burden, this
# workflow can be deleted with no loss of correctness — the three
# layers above cover all cases.

on:
  schedule:
    - cron: '0 10 1 * *' # 1st of each month, 10:00 UTC
  workflow_dispatch:


permissions:
  contents: read

concurrency:
  group: pin-actions
  cancel-in-progress: false

jobs:
  pin:
    name: Pin actions to SHAs
    runs-on: ubuntu-latest
    permissions:
      contents: read # PAT supplies write
      pull-requests: read # PAT supplies write
    steps:
      - name: Load 1Password secrets
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          WORKFLOWS_PAT: op://Bizarre-Industries/sojourn-workflows-pat/credential

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PAT instead of GITHUB_TOKEN — needed because the post-job
          # cleanup step and any subsequent git push must be allowed
          # to modify .github/workflows/. persist-credentials: true
          # so the token sticks for the create-pull-request step's
          # implicit branch operations.
          token: ${{ env.WORKFLOWS_PAT }}
          persist-credentials: true

      - name: Install pinact
        run: |
          PINACT_VERSION="3.5.0"
          curl -sSL -o /tmp/pinact.tar.gz \
            "https://github.com/suzuki-shunsuke/pinact/releases/download/v${PINACT_VERSION}/pinact_linux_amd64.tar.gz"
          tar -xzf /tmp/pinact.tar.gz -C /tmp
          sudo install /tmp/pinact /usr/local/bin/pinact
          pinact --version

      - name: Run pinact
        run: pinact run --update

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # Same WORKFLOWS_PAT — peter-evans/create-pull-request needs
          # workflow scope to push the branch with workflow file diffs.
          token: ${{ env.WORKFLOWS_PAT }}
          branch: chore/pin-actions
          delete-branch: true
          base: main
          commit-message: 'chore: pin actions to immutable SHAs'
          title: 'chore: pin actions to immutable SHAs'
          body: |
            Automated SHA pinning sweep via [pinact](https://github.com/suzuki-shunsuke/pinact).

            All GitHub Actions references in `.github/workflows/` resolved to immutable commit SHAs with trailing `# v<tag>` comments for human readability.

            Verify with `pinact run --check` after merging.
          labels: |
            automated
            chore
            security
          assignees: binGhzal
