name: Zizmor

# Static analysis of GitHub Actions workflows. Catches:
#   - Unpinned action references.
#   - Untrusted input → shell injection.
#   - Persisted credentials misuse.
#   - Excessive permissions / token misuse.
#   - Cache-poisoning patterns.
#
# Install path: zizmor is published to PyPI as `zizmor`. Install via
# `uv tool` (Astral's fast Python package manager) — pre-compiled
# wheels, no Rust toolchain required at runtime. This is the canonical
# path per https://docs.zizmor.sh/integrations/.

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:


permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  zizmor:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5 # PIN-SHA-AFTER
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0 # PIN-SHA-AFTER
        with:
          version: "0.5.x"

      - name: Run zizmor
        env:
          # Some zizmor audits (e.g. impostor-commit detection) call
          # the GitHub API. Without GH_TOKEN those audits are skipped
          # silently — provide the workflow token.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # zizmor writes its report to stdout; redirect to capture.
          # There is no --output flag (zizmor 1.x).
          # --format=sarif always exits 0 even with findings, per the
          # zizmor docs; the SARIF upload step routes findings into
          # the Security tab.
          uvx zizmor@1.24.1 --format=sarif .github/ > zizmor.sarif

          # Plain output for the Actions log so findings are readable
          # without round-tripping through the Security tab. Plain
          # format exits non-zero on findings — `|| true` keeps the
          # step green so SARIF upload runs.
          uvx zizmor@1.24.1 --format=plain .github/ || true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4 # PIN-SHA-AFTER
        if: always()
        with:
          sarif_file: zizmor.sarif
          category: zizmor
