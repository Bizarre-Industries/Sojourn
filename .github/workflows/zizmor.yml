name: Zizmor

# Static analysis of GitHub Actions workflows. Catches:
#   - Unpinned action references.
#   - Untrusted input → shell injection.
#   - Persisted credentials misuse.
#   - Excessive permissions / token misuse.
#   - Cache-poisoning patterns.
#
# Install path: zizmor is published to PyPI as `zizmor`. Install via
# `uv tool` (Astral's fast Python package manager) — pre-compiled
# wheels, no Rust toolchain required at runtime. This is the canonical
# path per https://docs.zizmor.sh/integrations/.

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:


permissions:
  contents: read
  security-events: write
  actions: read

# Cancel stacked runs on PRs (force-pushes, rebases). Push/cron/dispatch
# always complete.
concurrency:
  group: zizmor-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.5.x"

      - name: Run zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uvx zizmor@1.24.1 --format=sarif .github/ > zizmor.sarif
          uvx zizmor@1.24.1 --format=plain .github/ || true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: always()
        with:
          sarif_file: zizmor.sarif
          category: zizmor
