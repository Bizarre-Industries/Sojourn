name: Zizmor

# Static analysis of GitHub Actions workflows. Catches:
#   - Unpinned action references.
#   - Untrusted input → shell injection.
#   - Persisted credentials misuse.
#   - Excessive permissions / token misuse.
#   - Cache-poisoning patterns.
#
# Install path: zizmor is published to PyPI as `zizmor`. Install via
# `uv tool` (Astral's fast Python package manager) — pre-compiled
# wheels, no Rust toolchain required at runtime. This is the canonical
# path per https://docs.zizmor.sh/integrations/.

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:


permissions:
  contents: read
  security-events: write
  actions: read

# Cancel stacked runs on PRs (force-pushes, rebases). Push/cron/dispatch
# always complete.
concurrency:
  group: zizmor-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.5.x"

      - name: Run zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uvx zizmor@1.24.1 --format=sarif .github/ > zizmor.sarif
          uvx zizmor@1.24.1 --format=plain .github/ || true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        if: always()
        with:
          sarif_file: zizmor.sarif
          category: zizmor
