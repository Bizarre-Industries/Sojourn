name: Zizmor

# Static analysis of GitHub Actions workflows. Catches:
#   - Unpinned action references (use of @vN tags instead of @<sha>).
#   - Untrusted input flowing into shell (script injection).
#   - Persisted credentials misuse.
#   - Excessive permissions / token misuse.
#   - Cache-poisoning patterns.
#
# Complementary to CodeQL's `actions` language pack — zizmor catches
# things CodeQL doesn't, and vice versa. Run both.
#
# Triggers:
#   - PR to main     — block merges that introduce unpinned actions
#   - push to main
#   - weekly cron

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:


permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  zizmor:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5 # PIN-SHA-AFTER
        with:
          persist-credentials: false

      - name: Install zizmor
        run: |
          set -euo pipefail
          ZIZMOR_VERSION="1.5.0"
          curl -sSL -o /tmp/zizmor.tar.gz \
            "https://github.com/woodruffw/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-${ZIZMOR_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/zizmor.tar.gz -C /tmp
          sudo mv /tmp/zizmor /usr/local/bin/zizmor
          chmod +x /usr/local/bin/zizmor
          zizmor --version

      - name: Run zizmor
        run: |
          # Output SARIF for the Security tab; also print human-readable
          # summary for the Actions log.
          zizmor --format=sarif --output=zizmor.sarif .github/
          zizmor --format=plain .github/ || true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4 # PIN-SHA-AFTER
        if: always()
        with:
          sarif_file: zizmor.sarif
          category: zizmor
