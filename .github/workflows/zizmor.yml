name: Zizmor

# Static analysis of GitHub Actions workflows. Catches:
#   - Unpinned action references.
#   - Untrusted input → shell injection.
#   - Persisted credentials misuse.
#   - Excessive permissions / token misuse.
#   - Cache-poisoning patterns.
#
# Install path: zizmor is published to PyPI as `zizmor`. Install via
# `uv tool` (Astral's fast Python package manager) — pre-compiled
# wheels, no Rust toolchain required at runtime. This is the canonical
# path per https://docs.zizmor.sh/integrations/.

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:


permissions:
  contents: read
  security-events: write
  actions: read

# Cancel stacked runs on PRs (force-pushes, rebases). Push/cron/dispatch
# always complete.
concurrency:
  group: zizmor-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.5.x"

      - name: Run zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uvx zizmor@1.24.1 --format=sarif .github/ > zizmor.sarif
          uvx zizmor@1.24.1 --format=plain .github/ || true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@e46ed2cbd01164d986452f91f178727624ae40d7 # v4.35.3
        if: always()
        with:
          sarif_file: zizmor.sarif
          category: zizmor
