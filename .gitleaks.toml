# Sojourn's own CI gitleaks config.
# Used by `.github/workflows/ci.yml` to scan this repo.
# NOT the same as `Sojourn/Resources/data/gitleaks.toml`, which is the default
# bundle shipped to end users for scanning THEIR dotfile repos.

title = "Sojourn CI secret-scan rules"

[extend]
# Start from gitleaks' built-in rule set, then refine.
useDefault = true

[allowlist]
description = "Paths that contain deliberate sample/fixture data, plus build artifacts."
paths = [
  '''SojournTests/Fixtures/.*\.json$''',
  '''SojournTests/Fixtures/.*\.toml$''',
  '''SojournTests/Fixtures/.*\.txt$''',
  '''SojournTests/Fixtures/.*\.plist$''',
  '''docs/.*\.md$''',
  '''\.build/.*''',
  '''\.ruff_cache/.*''',
  '''\.remember/.*''',
  '''Sojourn\.xcodeproj/.*''',
]

# Regex allowlist: obvious sample/placeholder patterns.
regexes = [
  '''age1[a-z0-9]{10,}''',                        # age recipient examples
  '''ghp_[A-Z]{36}''',                            # all-caps placeholder PATs
  '''ghp_[xX]{36,}''',                            # all-x placeholder PATs (design handoff)
  '''ghp_EXAMPLE[A-Za-z0-9]{0,40}''',             # synthetic fixture PATs
  '''github_pat_EXAMPLE[A-Za-z0-9_]{0,90}''',      # synthetic fine-grained PATs
  '''ghu_EXAMPLE[A-Za-z0-9_]{0,90}''',             # synthetic app user tokens
  '''ghr_EXAMPLE[A-Za-z0-9_]{0,90}''',             # synthetic app refresh tokens
  '''ghs_[0-9]+_EXAMPLE[A-Za-z0-9_\.]{0,260}''',   # synthetic app installation tokens
  '''AKIAIOSFODNN7EXAMPLE''',                     # AWS docs canary
  '''AKIAEXAMPLE[A-Z0-9]{0,16}''',                # synthetic fixture AWS keys
  '''wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY''', # AWS docs canary
  '''sk-EXAMPLE[A-Za-z0-9]{0,40}''',              # synthetic fixture OpenAI keys
  '''sk_live_EXAMPLE[A-Za-z0-9]{0,40}''',         # synthetic fixture Stripe keys
]

# Hard rules on top of defaults — fail PR on these unconditionally.
# These mirror rules/providers where a real key is never safe to commit.
[[rules]]
id = "sojourn-aws-access-key"
description = "AWS access key ID"
regex = '''(?i)(AKIA|ASIA)[A-Z0-9]{16}'''
entropy = 3.0
keywords = ["AKIA", "ASIA"]

[[rules]]
id = "sojourn-github-pat"
description = "GitHub classic personal access token"
regex = '''ghp_[A-Za-z0-9_]{20,}'''
keywords = ["ghp_"]

[[rules]]
id = "sojourn-github-fine-grained-pat"
description = "GitHub fine-grained personal access token"
regex = '''github_pat_[A-Za-z0-9_]{20,}'''
keywords = ["github_pat_"]

[[rules]]
id = "sojourn-github-oauth-token"
description = "GitHub OAuth access token"
regex = '''gho_[A-Za-z0-9_]{20,}'''
keywords = ["gho_"]

[[rules]]
id = "sojourn-github-app-user-token"
description = "GitHub App user-to-server token"
regex = '''ghu_[A-Za-z0-9_]{20,}'''
keywords = ["ghu_"]

[[rules]]
id = "sojourn-github-app-installation-token"
description = "GitHub App installation token"
regex = '''ghs_[A-Za-z0-9_\.]{20,}'''
keywords = ["ghs_"]

[[rules]]
id = "sojourn-github-app-refresh-token"
description = "GitHub App refresh token"
regex = '''ghr_[A-Za-z0-9_]{20,}'''
keywords = ["ghr_"]

[[rules]]
id = "sojourn-openai-key"
description = "OpenAI API key"
regex = '''sk-(proj-)?[A-Za-z0-9]{32,}'''
keywords = ["sk-"]

[[rules]]
id = "sojourn-stripe-live"
description = "Stripe live secret key"
regex = '''sk_live_[A-Za-z0-9]{24,}'''
keywords = ["sk_live_"]

[[rules]]
id = "sojourn-anthropic-key"
description = "Anthropic API key"
regex = '''sk-ant-[A-Za-z0-9\-_]{40,}'''
keywords = ["sk-ant-"]

[[rules]]
id = "sojourn-apple-app-specific"
description = "Apple app-specific password (notarization secret)"
regex = '''(^|[^a-z-])[a-z]{4}-[a-z]{4}-[a-z]{4}-[a-z]{4}([^a-z-]|$)'''
entropy = 3.5
keywords = [
  "AC_PASSWORD",
  "APPLE_ID_PASSWORD",
  "app-specific",
  "notarization",
  "notary",
  "notarytool",
]
