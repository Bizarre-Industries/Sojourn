# Sojourn docs redirects map
#
# Machine-readable record of every doc that moved during the Diátaxis
# restructure. CI uses this to allowlist redirect stubs in markdown-link-check.
# Stubs at the `from` path will be removed at the `sunset_version` release.
#
# Schema:
#   [[redirect]]
#   from = "<repo-relative path>"
#   to = "<repo-relative path>"
#   sunset_version = "vX.Y"
#   phase = <0-9>      # which restructure phase moved it
#   note = "<optional>"
#
# Add entries when moving files; never delete entries until the sunset_version
# ships and the stub is removed.

