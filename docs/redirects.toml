# Phase 3 — ARCHITECTURE.md split + BOOTSTRAP.md merge
#
# ARCHITECTURE.md is preserved at _legacy_architecture.md so `git log --follow`
# walks the rename history. The stub at the original path maps every old §X
# anchor to its new home so external blog links keep working.

[[redirect]]
from = "docs/ARCHITECTURE.md"
to = "docs/reference/architecture.md"   # primary destination; full anchor map in stub body
sunset_version = "v0.4"
phase = 3
note = "Long stub with anchor map. High inbound-link density; one minor later sunset than other Phase 2/3 stubs."

[[redirect]]
