# Sojourn — xcodegen project spec
# Generate Sojourn.xcodeproj via: xcodegen generate
# Regenerate after changes: scripts/regenerate-project.sh

name: Sojourn
options:
  bundleIdPrefix: app.bizarre
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  xcodeVersion: "26.0"
  createIntermediateGroups: true

packages:
  swift-subprocess:
    url: https://github.com/swiftlang/swift-subprocess.git
    minorVersion: 0.4.0
  MenuBarExtraAccess:
    url: https://github.com/orchetect/MenuBarExtraAccess.git
    minorVersion: 1.3.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    minorVersion: 2.9.0

settings:
  base:
    SWIFT_VERSION: "6.1"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""  # Set per-user in xcconfig or via xcodebuild
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    SWIFT_UPCOMING_FEATURE_INTERNAL_IMPORTS_BY_DEFAULT: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  Sojourn:
    type: application
    platform: macOS
    sources:
      - path: Sojourn
        excludes:
          - Info.plist
          - Sojourn.entitlements
          - SojournDebug.entitlements
          - Resources/bin
          - Resources/data
          - Resources/Fonts
          - Config
      # Folder references — bundled as `data/` and `Fonts/` directories
      # at the .app's Resources root. xcodegen 2.45+ ignores
      # `resources:` entries with `type: folder`, so these live under
      # `sources` with an explicit buildPhase.
      - path: Sojourn/Resources/data
        type: folder
        buildPhase: resources
      - path: Sojourn/Resources/Fonts
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Sojourn
        PRODUCT_BUNDLE_IDENTIFIER: app.bizarre.sojourn
        INFOPLIST_FILE: Sojourn/Info.plist
        MARKETING_VERSION: 0.4.0
        CURRENT_PROJECT_VERSION: 35
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO  # scripts/sign.sh needs codesign access
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Sojourn/SojournDebug.entitlements
          xcconfig: Sojourn/Config/Debug.xcconfig
        Release:
          CODE_SIGN_ENTITLEMENTS: Sojourn/Sojourn.entitlements
          xcconfig: Sojourn/Config/Release.xcconfig
    dependencies:
      - package: swift-subprocess
        product: Subprocess
      - package: MenuBarExtraAccess
        product: MenuBarExtraAccess
      - package: Sparkle
        product: Sparkle
      # MasHelper is built and copied via postBuildScript below — Apple
      # SMAppService daemons must live in Contents/MacOS/, but
      # xcodegen's `embed: true` for `tool` products lands them in
      # Contents/Resources/ which mismatches the Launchd plist's
      # BundleProgram path. Explicit copy keeps the path under our
      # control.
      - target: MasHelper
        link: false
        embed: false
    preBuildScripts:
      - name: Re-sign bundled binaries
        script: |
          # Re-sign gitleaks and age with hardened runtime
          # See docs/ARCHITECTURE.md §11 (bundled binaries)
          if [ -f "${SRCROOT}/scripts/sign.sh" ]; then
            "${SRCROOT}/scripts/sign.sh" "${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Resources/bin"
          fi
        inputFiles: []
        outputFiles: []
        basedOnDependencyAnalysis: false
        runOnlyWhenInstalling: false
    postBuildScripts:
      - name: Embed MasHelper binary + launchd plist
        script: |
          # SMAppService.daemon(plistName:) requires:
          #   1) helper binary at Contents/MacOS/<helper-name>
          #   2) launchd plist at Contents/Library/LaunchDaemons/<plist-name>
          # The plist's BundleProgram field points at the binary's
          # bundle-relative path. Per ADR-0024 + council 2026-05-03.
          set -euo pipefail
          app_bundle="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app"
          src_bin="${BUILT_PRODUCTS_DIR}/industries.bizarre.Sojourn.helper"
          dst_bin_dir="${app_bundle}/Contents/MacOS"
          dst_plist_dir="${app_bundle}/Contents/Library/LaunchDaemons"

          mkdir -p "${dst_bin_dir}" "${dst_plist_dir}"
          cp "${src_bin}" "${dst_bin_dir}/industries.bizarre.Sojourn.helper"
          cp "${SRCROOT}/MasHelper/Launchd.plist" "${dst_plist_dir}/industries.bizarre.Sojourn.helper.plist"

          # Re-codesign the embedded binary in the same step. Without
          # this the helper retains its standalone signature which
          # references its original path, and macOS rejects the
          # SMAppService.register() call.
          if [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            codesign --force --options=runtime \
              --entitlements "${SRCROOT}/MasHelper/MasHelper.entitlements" \
              --sign "${EXPANDED_CODE_SIGN_IDENTITY}" \
              "${dst_bin_dir}/industries.bizarre.Sojourn.helper"
          else
            codesign --force --sign - \
              --entitlements "${SRCROOT}/MasHelper/MasHelper.entitlements" \
              "${dst_bin_dir}/industries.bizarre.Sojourn.helper"
          fi
        inputFiles:
          - $(SRCROOT)/MasHelper/Launchd.plist
          - $(BUILT_PRODUCTS_DIR)/industries.bizarre.Sojourn.helper
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(PRODUCT_NAME).app/Contents/MacOS/industries.bizarre.Sojourn.helper
          - $(BUILT_PRODUCTS_DIR)/$(PRODUCT_NAME).app/Contents/Library/LaunchDaemons/industries.bizarre.Sojourn.helper.plist
        basedOnDependencyAnalysis: false
        runOnlyWhenInstalling: false

  MasHelper:
    type: tool
    platform: macOS
    sources:
      - path: MasHelper
        excludes:
          - Info.plist
          - MasHelper.entitlements
          - Launchd.plist
      # MasHelperProtocol is the shared XPC contract; both targets
      # compile it. Single source of truth for mach-service name,
      # bundle id, sentinel exit codes, and the @objc protocol.
      - Sojourn/Services/MasHelperProtocol.swift
      - Sojourn/Services/MasExecutableValidator.swift
    settings:
      base:
        PRODUCT_NAME: industries.bizarre.Sojourn.helper
        PRODUCT_BUNDLE_IDENTIFIER: industries.bizarre.Sojourn.helper
        INFOPLIST_FILE: MasHelper/Info.plist
        CODE_SIGN_ENTITLEMENTS: MasHelper/MasHelper.entitlements
        MARKETING_VERSION: 0.4.0
        CURRENT_PROJECT_VERSION: 35
        GENERATE_INFOPLIST_FILE: NO
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES

  SojournTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SojournTests
        excludes:
          - Fixtures
      - path: SojournTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Sojourn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bizarre.sojourn.tests
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Sojourn.app/Contents/MacOS/Sojourn
        SWIFT_EMIT_LOC_STRINGS: NO
        GENERATE_INFOPLIST_FILE: YES

  SojournUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - SojournUITests
    dependencies:
      - target: Sojourn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bizarre.sojourn.uitests
        TEST_TARGET_NAME: Sojourn
        SWIFT_EMIT_LOC_STRINGS: NO
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Sojourn:
    build:
      targets:
        Sojourn: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - SojournTests
        - SojournUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
